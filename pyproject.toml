[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nourishnet-ai"
version = "0.1.0"
description = "AI-powered food delivery intelligence backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["fastapi", "ml", "ai", "computer-vision", "nlp", "recommendations"]

dependencies = [
    "fastapi==0.138.2",
    "uvicorn==0.49.0",
    "joblib==1.5.3",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "Pillow==12.2.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "transformers==5.12.1",
    "python-multipart==0.0.32",
]